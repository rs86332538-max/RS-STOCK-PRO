<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portefølje Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;background:#07090f;color:#e2e8f0;font-family:'DM Sans','Segoe UI',sans-serif;font-size:14px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1e293b;border-radius:3px}
#glow{position:fixed;top:0;left:0;right:0;height:55vh;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% -15%,rgba(99,102,241,0.14) 0%,transparent 60%)}
.app{max-width:1500px;margin:0 auto;padding:0 28px;position:relative;z-index:1}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;border-bottom:1px solid rgba(255,255,255,0.05);margin-bottom:20px;flex-wrap:wrap;gap:12px}
.hdr-left{display:flex;align-items:center;gap:12px}
.htitle{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#f8fafc;letter-spacing:-.4px}
.htitle span{color:#818cf8}
.hsub{font-size:11px;color:#334155;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{padding:4px 11px;border-radius:20px;font-size:10px;font-weight:600;background:rgba(255,255,255,0.05);color:#475569;border:1px solid rgba(255,255,255,0.07)}
.live-btn{display:flex;align-items:center;gap:7px;padding:8px 18px;border-radius:10px;font-size:12px;font-weight:700;background:linear-gradient(135deg,rgba(34,197,94,0.2),rgba(16,185,129,0.15));color:#4ade80;border:1px solid rgba(34,197,94,0.35);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;letter-spacing:.01em}
.live-btn:hover:not(:disabled){background:linear-gradient(135deg,rgba(34,197,94,0.32),rgba(16,185,129,0.25));border-color:rgba(34,197,94,0.55)}
.live-btn:disabled{opacity:.45;cursor:not-allowed}
.live-btn .dot{width:8px;height:8px;border-radius:50%;background:#4ade80}
.live-btn .dot.pulsing{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.progress-bar{height:3px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;margin-bottom:16px;display:none}
.progress-fill{height:100%;background:linear-gradient(90deg,#6366f1,#22c55e);border-radius:2px;transition:width .4s ease;width:0}
.progress-label{font-size:10px;color:#475569;margin-bottom:6px;display:none}

/* TABS */
.tabs{display:flex;gap:3px;background:rgba(255,255,255,0.03);border-radius:10px;padding:3px;border:1px solid rgba(255,255,255,0.06);width:fit-content;margin-bottom:20px}
.tab{padding:7px 18px;border-radius:7px;font-size:12px;font-weight:500;background:none;border:none;cursor:pointer;color:#475569;transition:all .15s;font-family:'DM Sans',sans-serif}
.tab.active{background:rgba(255,255,255,0.09);color:#e2e8f0}

/* OVERVIEW */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:rgba(255,255,255,0.03);border-radius:12px;border:1px solid rgba(255,255,255,0.06);padding:14px 18px;transition:border-color .2s}
.stat-card.fresh{border-color:rgba(34,197,94,0.3);animation:flashGreen .8s ease}
@keyframes flashGreen{0%{border-color:rgba(34,197,94,.7)}100%{border-color:rgba(34,197,94,.3)}}
.sc-label{font-size:9px;color:#334155;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.sc-val{font-size:22px;font-weight:800;font-family:'Syne',sans-serif;color:#f8fafc}
.sc-sub{font-size:10px;color:#1e293b;margin-top:3px}

/* SECTION TITLE */
.stitle{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.stitle-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,0.05);color:#475569;text-transform:none;letter-spacing:0}

/* ACTIVITY FEED */
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:9px;margin-bottom:22px}
.act-card{background:rgba(255,255,255,0.025);border-radius:11px;border:1px solid rgba(255,255,255,0.055);padding:13px 15px;display:flex;gap:11px;transition:all .2s}
.act-card:hover{background:rgba(255,255,255,0.04)}
.act-card.fresh{border-color:rgba(34,197,94,.4);animation:flashGreen .8s ease}
.ac-left{flex-shrink:0;display:flex;align-items:flex-start;padding-top:2px}
.ac-inv-name{font-size:11px;font-weight:700;color:#818cf8;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ac-body{flex:1;min-width:0}
.ac-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.ac-ticker{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:#f8fafc}
.ac-name{font-size:10px;color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.ab{padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;border:1px solid;white-space:nowrap}
.ab.buy{background:#22c55e12;color:#22c55e;border-color:#22c55e28}
.ab.sell{background:#ef444412;color:#ef4444;border-color:#ef444428}
.ab.add{background:#6366f112;color:#818cf8;border-color:#6366f128}
.ab.trim{background:#f59e0b12;color:#f59e0b;border-color:#f59e0b28}
.ac-reason{font-size:11px;color:#475569;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px}
.ac-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ac-date{font-size:9px;color:#2d3f55;font-family:'JetBrains Mono',monospace}
.ac-val{font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace}
.ac-val.p{color:#22c55e}.ac-val.n{color:#ef4444}
.ac-tag{font-size:9px;color:#1e293b;background:rgba(255,255,255,0.03);border-radius:3px;padding:1px 5px;border:1px solid rgba(255,255,255,0.05)}

/* RANK + FLOW */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.rank-list{display:flex;flex-direction:column;gap:5px}
.rank-row{display:flex;align-items:center;gap:9px;padding:9px 13px;background:rgba(255,255,255,0.025);border-radius:9px;border:1px solid rgba(255,255,255,0.05)}
.rnum{font-size:10px;font-family:'JetBrains Mono',monospace;color:#1e293b;width:18px;flex-shrink:0}
.ravatar{font-size:17px;flex-shrink:0}
.rinfo{flex:1;min-width:0}
.rname{font-size:11px;font-weight:600;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtype{font-size:9px;color:#2d3f55}
.rbar-wrap{width:90px;flex-shrink:0}
.rbar{height:4px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden}
.rbar-fill{height:100%;border-radius:2px;transition:width .7s ease}
.rcount{font-size:10px;font-family:'JetBrains Mono',monospace;color:#475569;width:38px;text-align:right;flex-shrink:0}

.flow-card{background:rgba(255,255,255,0.025);border-radius:12px;border:1px solid rgba(255,255,255,0.06);padding:16px 20px}
.flow-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.flow-row:last-child{margin-bottom:0}
.flow-sec-label{font-size:11px;color:#64748b;display:flex;justify-content:space-between}
.flow-bars{display:flex;gap:3px;height:6px}
.flow-in{border-radius:3px 0 0 3px;overflow:hidden;transition:flex .5s}
.flow-in-fill{height:100%;background:#22c55e;border-radius:3px 0 0 3px}
.flow-out{border-radius:0 3px 3px 0;overflow:hidden;transition:flex .5s}
.flow-out-fill{height:100%;background:#ef4444;border-radius:0 3px 3px 0}

/* TRANSACTIONS TABLE */
.tx-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;align-items:center}
.tx-search{flex:1;min-width:200px;padding:8px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);border-radius:9px;color:#e2e8f0;font-size:12px;outline:none;font-family:'DM Sans',sans-serif}
.tx-search::placeholder{color:#2d3f55}
.tx-search:focus{border-color:rgba(255,255,255,0.2)}
.flt{padding:6px 11px;border-radius:7px;font-size:11px;background:rgba(255,255,255,0.04);color:#475569;border:1px solid transparent;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.flt:hover{color:#94a3b8}
.flt.on{color:#e2e8f0;background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.12)}
.sep{width:1px;height:20px;background:rgba(255,255,255,0.06);margin:0 2px;flex-shrink:0}

.tx-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ts{background:rgba(255,255,255,0.025);border-radius:10px;border:1px solid rgba(255,255,255,0.06);padding:10px 14px;flex:1;min-width:115px}
.ts-lbl{font-size:9px;color:#2d3f55;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.ts-val{font-size:17px;font-weight:800;font-family:'Syne',sans-serif;color:#f8fafc}
.ts-sub{font-size:9px;color:#1e293b;margin-top:2px}

.tbl-wrap{background:rgba(255,255,255,0.025);border-radius:13px;border:1px solid rgba(255,255,255,0.06);overflow:hidden}
.tbl{width:100%;border-collapse:collapse}
.tbl thead th{padding:9px 13px;font-size:9px;color:#334155;text-transform:uppercase;letter-spacing:.08em;font-weight:700;border-bottom:1px solid rgba(255,255,255,0.05);background:#07090f;cursor:pointer;user-select:none;transition:color .15s;white-space:nowrap}
.tbl thead th:hover{color:#94a3b8}
.tbl thead th.sa::after{content:" ↑";color:#818cf8;font-size:10px}
.tbl thead th.sd::after{content:" ↓";color:#818cf8;font-size:10px}
.tbl thead th.r,.tbl tbody td.r{text-align:right}
.tbl tbody tr{border-bottom:1px solid rgba(255,255,255,0.025);transition:background .15s}
.tbl tbody tr:last-child{border-bottom:none}
.tbl tbody tr:hover{background:rgba(255,255,255,0.04)}
.tbl tbody tr.fresh{animation:rowFlash .8s ease}
@keyframes rowFlash{0%{background:rgba(34,197,94,.12)}100%{background:transparent}}
.tbl tbody td{padding:10px 13px;font-size:12px;vertical-align:middle;white-space:nowrap}
.inv-cell{display:flex;align-items:center;gap:8px}
.inv-dot{height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.inv-n{font-size:11px;font-weight:600;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.inv-s{font-size:9px;color:#2d3f55}
.tk-cell{display:flex;align-items:center;gap:8px}
.tk-badge{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:'Syne',sans-serif;flex-shrink:0}
.tk-n{font-size:12px;font-weight:600;color:#e2e8f0}
.tk-s{font-size:9px;color:#2d3f55;margin-top:1px}
.mono{font-family:'JetBrains Mono',monospace}
.vp{color:#22c55e;font-weight:700}.vn{color:#ef4444;font-weight:700}.vg{color:#64748b}
.reason-td{max-width:240px;white-space:normal;font-size:11px;color:#475569;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ttags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.ttag{font-size:9px;color:#2d3f55;background:rgba(255,255,255,0.03);border-radius:3px;padding:1px 5px;border:1px solid rgba(255,255,255,0.05)}
.pager{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-top:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.15);flex-wrap:wrap;gap:8px}
.pager-info{font-size:10px;color:#334155}
.pager-btns{display:flex;gap:3px}
.pb{padding:5px 9px;border-radius:6px;font-size:10px;background:rgba(255,255,255,0.04);color:#475569;border:1px solid transparent;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.pb:hover:not(:disabled){background:rgba(255,255,255,0.08);color:#94a3b8}
.pb:disabled{opacity:.25;cursor:default}
.pb.cur{background:rgba(255,255,255,0.1);color:#e2e8f0}

/* LIVE MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);display:none}
.modal.open{display:flex}
.modal-box{background:#0d1117;border:1px solid rgba(255,255,255,0.1);border-radius:18px;width:760px;max-width:96vw;max-height:92vh;overflow:hidden;display:flex;flex-direction:column}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,0.07)}
.modal-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:#f8fafc}
.modal-close{padding:5px 10px;border-radius:7px;background:rgba(255,255,255,0.06);color:#64748b;border:1px solid rgba(255,255,255,0.1);cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif}
.modal-body{flex:1;overflow-y:auto;padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid rgba(255,255,255,0.07);display:flex;gap:10px;justify-content:flex-end}
.run-btn{padding:9px 22px;border-radius:9px;font-size:13px;font-weight:700;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s}
.run-btn:hover{opacity:.88}
.run-btn:disabled{opacity:.4;cursor:not-allowed}
.cancel-btn{padding:9px 18px;border-radius:9px;font-size:13px;background:rgba(255,255,255,0.06);color:#94a3b8;border:1px solid rgba(255,255,255,0.1);cursor:pointer;font-family:'DM Sans',sans-serif}
.inv-pick-grid{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto}
.pick-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .15s;border:1px solid transparent}
.pick-row:hover{background:rgba(255,255,255,0.04)}
.pick-row.selected{background:rgba(99,102,241,.12);border-color:rgba(99,102,241,.3)}
.pick-row input[type=checkbox]{accent-color:#818cf8;width:14px;height:14px;flex-shrink:0;cursor:pointer}
.pick-avatar{font-size:17px;flex-shrink:0}
.pick-name{font-size:12px;font-weight:600;color:#94a3b8;flex:1}
.pick-row.selected .pick-name{color:#e2e8f0}
.pick-sub{font-size:10px;color:#2d3f55}
.pick-sel-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pick-count{font-size:11px;color:#475569}
.pick-search{flex:1;min-width:150px;padding:6px 11px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:7px;color:#e2e8f0;font-size:11px;outline:none;font-family:'DM Sans',sans-serif}
.pick-search::placeholder{color:#2d3f55}
.sel-btn{padding:5px 10px;border-radius:6px;font-size:10px;background:rgba(255,255,255,0.04);color:#475569;border:1px solid transparent;cursor:pointer;font-family:'DM Sans',sans-serif}
.sel-btn:hover{color:#94a3b8}
.progress-section{margin-bottom:16px}
.prog-track{height:6px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#6366f1,#22c55e);transition:width .4s ease;width:0}
.prog-label{font-size:11px;color:#64748b}
.prog-log{margin-top:10px;max-height:140px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.log-line{font-size:11px;font-family:'JetBrains Mono',monospace;padding:4px 8px;border-radius:5px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05)}
.log-line.ok{color:#22c55e;border-color:rgba(34,197,94,.2)}
.log-line.err{color:#f87171;border-color:rgba(239,68,68,.2)}
.log-line.run{color:#818cf8;border-color:rgba(99,102,241,.2)}

@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.au{animation:fadeUp .28s ease forwards}
footer{padding:16px 0;font-size:10px;color:#1e293b;text-align:center;border-top:1px solid rgba(255,255,255,0.03);margin-top:10px}

/* StockIntel page shell override: match Analyse/Screener/Week Breakout */
:root{
  --gold:#ffd76a;--gold2:#ffb13b;--ruby:#ff2f72;--emerald:#0fe08a;--sapphire:#45e7ff;
  --bg:#060706;--panel:#0b090d;--panel2:#100d12;--line:rgba(255,215,106,.18);--line2:rgba(255,215,106,.09);
  --text:#fff7dc;--dim:#d7c891;--muted:#9f8f62;
}
body{
  background:
    radial-gradient(circle at 18% 0,rgba(255,215,106,.10),transparent 28%),
    radial-gradient(circle at 82% 12%,rgba(255,47,114,.10),transparent 30%),
    linear-gradient(180deg,#09070b,#050607 42%,#07110d 100%) !important;
  color:var(--text)!important;
  font-family:"IBM Plex Mono","JetBrains Mono",Consolas,monospace!important;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,215,106,.026) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,215,106,.026) 1px,transparent 1px);
  background-size:72px 72px;
}
body:after{content:"777";position:fixed;right:3vw;top:8vh;z-index:0;font-size:23vw;font-weight:900;letter-spacing:-2vw;color:rgba(255,215,106,.025);pointer-events:none}
#glow{display:none!important}
.app{max-width:1500px!important;padding:24px!important}
.hdr{
  overflow:hidden;
  background:linear-gradient(145deg,rgba(17,12,18,.94),rgba(6,12,10,.88))!important;
  border:1px solid rgba(255,215,106,.28)!important;
  border-radius:24px!important;
  box-shadow:0 26px 90px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.08)!important;
  padding:18px 20px!important;
  margin:0 0 14px!important;
  position:relative;
}
.hdr:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--ruby),var(--emerald),var(--sapphire))}
.hdr:after{content:"";position:absolute;inset:10px;border:1px solid rgba(255,215,106,.055);border-radius:19px;pointer-events:none}
.hdr-left,.hdr-right{position:relative;z-index:1}
.htitle{
  font-family:inherit!important;
  font-size:20px!important;
  letter-spacing:2px!important;
  color:var(--gold)!important;
  text-shadow:0 0 24px rgba(255,215,106,.28)!important;
}
.htitle span{color:var(--ruby)!important}
.hsub,.badge,.sc-label,.sc-sub,.stitle,.stitle-badge,.rtype,.ac-name,.ac-reason,.ac-date,.ac-tag,.ts-lbl,.ts-sub,.pager-info,.rnum,.rcount,.tk-s,.reason-td,.ttag,footer{color:#bda76b!important}
.badge,.ab,.ttag,.ac-tag,.stitle-badge,.pb,.flt,.tab,.live-btn,.modal-close,.cancel-btn,.sel-btn,input,button{
  border-radius:999px!important;
  border-color:rgba(255,215,106,.28)!important;
  background:linear-gradient(145deg,rgba(15,13,19,.92),rgba(7,7,10,.88))!important;
  color:var(--gold)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px rgba(0,0,0,.25)!important;
  font-family:inherit!important;
}
.tab.active,.tab:hover,.live-btn:hover:not(:disabled),.flt.on,.flt:hover,.pb.cur,.pb:hover:not(:disabled),.run-btn{
  background:linear-gradient(135deg,rgba(255,215,106,.20),rgba(255,47,114,.10),rgba(15,224,138,.08))!important;
  color:#fff!important;
  border-color:var(--gold)!important;
  box-shadow:0 0 28px rgba(255,215,106,.22),inset 0 1px 0 rgba(255,255,255,.12)!important;
}
.tabs{
  background:transparent!important;
  border:0!important;
  gap:7px!important;
  margin-bottom:14px!important;
  padding:0!important;
}
.tab{font-size:9px!important;font-weight:900!important;letter-spacing:1px!important;text-transform:uppercase!important;padding:8px 13px!important}
.stat-grid,.tx-stats{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))!important;gap:12px!important}
.stat-card,.ts,.rank-row,.flow-card,.act-card,.tbl-wrap,.modal-box,.pick-row,.log-line,.prog-track{

const ACT = { buy:"🟢 KØB", sell:"🔴 SALG", add:"🔵 TILFØJ", trim:"🟡 REDUCER" };
const MONTHS = ["JAN","FEB","MAR","APR","MAJ","JUN","JUL","AUG","SEP","OKT","NOV","DEC"];

function htmlSafe(v) {
  return String(v ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
}
function fmtV(v, abs=false) {
  const n = abs ? Math.abs(v||0) : (v||0);
  if (Math.abs(n) >= 1) return `$${n.toFixed(2)}B`;
  return `$${((n)*1000).toFixed(0)}M`;
}
function fmtShares(n) {
  if (!n) return "—";
  const a = Math.abs(n);
  if (a >= 1e9) return (a/1e9).toFixed(2)+"B";
  if (a >= 1e6) return (a/1e6).toFixed(1)+"M";
  return a.toLocaleString();
}
function dateStr(d) {
  const dt = new Date(d||"2026-01-01");
  return `${String(dt.getDate()).padStart(2,"0")} ${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
}
function getEffective(id) {
  return LIVE_DATA[id] || INV_MAP[id];
}
function allTx() {
  const rows = [];
  investorUniverse().forEach(inv => {
    const eff = getEffective(inv.id);
    (eff.tx || []).forEach(t => rows.push({ ...t, investor: eff }));
  });
  return rows;
}

// ── RENDER TRANSACTIONS ───────────────────────────────────────────────────────
function getTxFiltered() {
  let rows = allTx();
  const q = txState.search.toLowerCase();
  if (q) rows = rows.filter(r =>
    (r.ticker||"").toLowerCase().includes(q) ||
    (r.name||"").toLowerCase().includes(q) ||
    (r.sector||"").toLowerCase().includes(q) ||
    r.investor.name.toLowerCase().includes(q) ||
    (r.reason||"").toLowerCase().includes(q)
  );
  if (txState.action !== "all") rows = rows.filter(r => r.action === txState.action);
  if (txState.cat !== "all") rows = rows.filter(r => r.investor.cat === txState.cat);
  rows.sort((a,b) => {
    let av, bv;
    switch(txState.sort) {
      case "date":     av=a.date||""; bv=b.date||""; break;
      case "investor": av=a.investor.name; bv=b.investor.name; break;
      case "ticker":   av=a.ticker||""; bv=b.ticker||""; break;
      case "action":   av=a.action||""; bv=b.action||""; break;
      case "value":    av=Math.abs(a.value||0); bv=Math.abs(b.value||0); break;
      case "shares":   av=Math.abs(a.shares||0); bv=Math.abs(b.shares||0); break;
      default:         av=a.date||""; bv=b.date||"";
    }
    const c = typeof av==="string" ? av.localeCompare(bv) : av-bv;
    return txState.dir==="asc" ? c : -c;
  });
  return rows;
}

function renderTx() {
  const filtered = getTxFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / txState.per));
  if (txState.page > totalPages) txState.page = totalPages;
  const start = (txState.page-1)*txState.per;
  const pageRows = filtered.slice(start, start+txState.per);

  const buys = filtered.filter(r=>r.action==="buy"||r.action==="add");
  const sells = filtered.filter(r=>r.action==="sell"||r.action==="trim");
  const totalIn = buys.reduce((s,r)=>s+Math.abs(r.value||0),0);
  const totalOut = sells.reduce((s,r)=>s+Math.abs(r.value||0),0);

  function th(col, lbl, right=false) {
    const isSorted = txState.sort===col;
    const cls = (right?"r ":"") + (isSorted ? (txState.dir==="asc"?"sa":"sd") : "");
    return `<th class="${cls}" onclick="txSort('${col}')">${lbl}</th>`;
  }

  const rowsHtml = pageRows.length === 0
    ? `<tr><td colspan="8" style="padding:32px;text-align:center;color:#1e293b">Ingen resultater matcher søgningen</td></tr>`
    : pageRows.map(r => {
        const isNeg = r.action==="sell"||r.action==="trim";
        const isLive = !!LIVE_DATA[r.investor.id];

function txSearch(v){

async function startLive() {
  if (liveSelected.size === 0) { alert("Vælg mindst 1 investor"); return; }
  liveRunning = true;
  document.getElementById("live-dot").classList.add("pulsing");
  document.getElementById("live-btn").disabled = true;

  const toRun = [...liveSelected];
  let done = 0;
  const total = toRun.length;

  document.getElementById("modal-title").textContent = "⚡ Live Kørsel — Opdaterer...";
  document.getElementById("modal-foot").innerHTML = `<span style="font-size:11px;color:#475569">Kører... ${done}/${total}</span>`;

  const renderProgress = (msg, type="run") => {
    const fill = (done/total*100).toFixed(1);
    document.getElementById("modal-body").innerHTML = `
      <div class="progress-section">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:11px;color:#64748b">${done}/${total} opdateret</span>
          <span style="font-size:11px;color:#475569">${fill}%</span>
        </div>
        <div class="prog-track"><div class="prog-fill" style="width:${fill}%"></div></div>
        <div class="prog-log" id="prog-log"></div>
      </div>`;
  };

  const addLog = (msg, type) => {
    const log = document.getElementById("prog-log");
    if (!log) return;
    const line = document.createElement("div");
    line.className = `log-line ${type}`;
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  };

  renderProgress();

  for (const id of toRun) {
    const inv = INV_MAP[id];
    if (!inv) { done++; continue; }
    renderProgress();
    addLog(`⟳ Henter ${inv.name}...`, "run");
    try {
      const data = await fetchLive(inv);
      LIVE_DATA[id] = { ...inv, tx: data.recentBuys || [] };
      done++;
      addLog(`✓ ${inv.name} — ${data.recentBuys?.length||0} transaktioner`, "ok");
    } catch(e) {
      done++;
      addLog(`✗ ${inv.name}: ${e.message}`, "err");
    }
    document.getElementById("modal-foot").innerHTML = `<span style="font-size:11px;color:#475569">Kører... ${done}/${total}</span>`;
  }

  liveRunning = false;
  document.getElementById("live-dot").classList.remove("pulsing");
  document.getElementById("live-btn").disabled = false;

  addLog(`✅ Færdig! ${Object.keys(LIVE_DATA).length} live investorer`, "ok");
  document.getElementById("modal-title").textContent = "⚡ Live Kørsel — Færdig!";
  document.getElementById("modal-foot").innerHTML = `
    <button class="cancel-btn" onclick="closeLiveModal();refreshViews()">Luk & Vis Resultater</button>
    <button class="run-btn" onclick="closeLiveModal();refreshViews()">✓ Vis opdaterede data</button>`;
}

async function fetchLive(inv) {
  const prompt = `Du er finansiel data-ekspert. Generer realistiske og aktuelle transaktionsdata for "${inv.name}" (${inv.type}, AUM: ${inv.aum}, ${inv.nation}) for perioden januar-maj 2026.
Svar KUN med JSON. Ingen markdown. Ingen forklaringer.
{"recentBuys":[{"date":"2026-04-15","ticker":"AAPL","name":"Apple Inc.","action":"buy","sector":"Teknologi","shares":2000000,"price":205.50,"value":0.41,"reason":"Detaljeret begrundelse på dansk 2-3 sætninger","tags":["tag1","tag2"]}]}
Regler: 4-6 transaktioner · action: buy/sell/add/trim · value i mia USD (negativ ved salg/trim) · price er kurs per aktie (null for private) · shares antal aktier (null for private) · alle tekster på dansk · vær specifik og realistisk for denne investors kendte stil og strategi`;

  let res;
  try {
    res = await fetchAnthropicMessages({ max_tokens:2000, messages:[{role:"user",content:prompt}] });
  } catch(e) { throw new Error("Netværksfejl: "+e.message); }
  if (!res.ok) {
    let d=""; try { const j=await res.json(); d=j.error?.message||""; } catch(_){}
    throw new Error(`API ${res.status}${d?": "+d:""}`);
  }
  const data = await res.json();
  const raw = (data.content||[]).map(c=>c.text||"").join("").trim();
  for (const attempt of [raw, raw.replace(/^```(?:json)?\s*/i,"").replace(/\s*```\s*$/i,"").trim()]) {
    try { return JSON.parse(attempt); } catch(_) {}
  }
  const m = raw.match(/\{[\s\S]*\}/);
  if (m) { try { return JSON.parse(m[0]); } catch(_) {} }
  throw new Error("Kunne ikke parse AI-svar");
}

function normalizeInvestorScanResults(items) {
  const seen = new Set();
  return items
    .filter(i => i && i.name)
    .map((i, idx) => {
      const name = String(i.name).trim();
      const id = "web_" + name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 54) + "_" + idx;
      return {
        id, name,
        avatar: "🔎",
        type: String(i.type || "Investor").trim(),
        aum: String(i.aum || "?").trim(),
        color: ["#6366f1","#0ea5e9","#22c55e","#f59e0b","#ef4444","#14b8a6"][idx % 6],
        cat: /fond|fund|capital|asset|management|pension|bank|office|partners|llp|llc|inc|corp|statsfond/i.test(`${i.name} ${i.type}`) ? "companies" : "individuals",
        nation: String(i.nation || "Ukendt").trim(),
        tx: [],
        aum_num: parseAUM(i.aum || ""),
        source_title: String(i.sourceTitle || "").trim(),
        source_url: String(i.sourceUrl || "").trim(),
        why_relevant: String(i.whyRelevant || "").trim(),
        confidence: String(i.confidence || "medium").trim(),
        discovered_by: "AI Web Scan",
        last_updated: new Date().toISOString()
      };
    })
    .filter(i => {
      const key = i.name.toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
}

const ANTHROPIC_MODEL_CANDIDATES = [
  "claude-sonnet-4-6",
  "claude-sonnet-4-5",
  "claude-3-5-sonnet-20241022"
];

async function fetchAnthropicMessages(payload) {
  let lastResponse = null;
  let lastErrorText = "";
  for (const model of ANTHROPIC_MODEL_CANDIDATES) {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type":"application/json",
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true",
        ...(SETTINGS.anthropicKey ? {"x-api-key": SETTINGS.anthropicKey} : {})
      },
      body: JSON.stringify({ ...payload, model })
    });
    if (res.ok) return res;
    lastResponse = res;
    try {
      const j = await res.clone().json();
      lastErrorText = j.error?.message || "";
    } catch(_) {
      lastErrorText = await res.clone().text().catch(() => "");
    }
    const isModelMissing = res.status === 404 && /model/i.test(lastErrorText);
    if (!isModelMissing) return res;
  }
  return lastResponse;
}

// ═══════════════════════════════════════════════════════════════
const DB_NAME = "PortfolioTrackerDB";
const DB_VERSION = 1;
let db = null;

async function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("investors")) {
        const s = db.createObjectStore("investors", { keyPath: "id" });
        s.createIndex("name", "name", { unique: false });
        s.createIndex("type", "type", { unique: false });
        s.createIndex("nation", "nation", { unique: false });
        s.createIndex("aum_num", "aum_num", { unique: false });
      }
      if (!db.objectStoreNames.contains("watchlist")) {
        db.createObjectStore("watchlist", { keyPath: "ticker" });
      }
      if (!db.objectStoreNames.contains("notes")) {
        db.createObjectStore("notes", { keyPath: "id" });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

async function seedDB() {
  if (!db) await initDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("investors", "readwrite");
    const store = tx.objectStore("investors");
    const countReq = store.count();
    let beforeCount = 0;
    countReq.onsuccess = () => {
      beforeCount = countReq.result || 0;
      const universe = investorUniverse();
      // Keep the local DB topped up to the current built-in investor universe.
      for (const inv of universe) {
        store.put({
          ...inv,
          aum_num: parseAUM(inv.aum),
          last_updated: new Date().toISOString()
        });
      }
    };
    tx.oncomplete = () => {
      const universeCount = investorUniverse().length;
      if (beforeCount < universeCount) {
        showToast(`✓ Database opdateret til ${universeCount} investorer`);
      }
      resolve();
    };
    tx.onerror = () => reject(tx.error);
  });
}

function parseAUM(s) {
  if (!s) return 0;
  const m = s.match(/([\d.]+)\s*([TBM])/i);
  if (!m) return 0;
  const n = parseFloat(m[1]);
  const u = m[2].toUpperCase();
  if (u === "T") return n * 1000;
  if (u === "B") return n;
  if (u === "M") return n / 1000;
  return n;
}

async function dbGetAll() {
  if (!db) await initDB();
  return new Promise((resolve) => {
    const tx = db.transaction("investors", "readonly");
    const req = tx.objectStore("investors").getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

async function dbSearch(query) {
  const all = await dbGetAll();
  if (!query) return all;
  const q = query.toLowerCase();
  return all.filter(i =>
    i.name.toLowerCase().includes(q) ||
    (i.type||"").toLowerCase().includes(q) ||
    (i.nation||"").toLowerCase().includes(q)
  );
}

async function clearDB() {
  if (!confirm("Ryd hele databasen? Dette sletter alle gemte investorer.")) return;
  if (!db) return;
  const tx = db.transaction("investors", "readwrite");
  tx.objectStore("investors").clear();
  showToast("🗑 Database ryddet");
  closeLiveModal();
}

async function exportDB() {
  const all = await dbGetAll();
  const blob = new Blob([JSON.stringify(all, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "portfolio-investors-export.json";
  a.click();
  showToast("✓ JSON eksporteret");
}

function buildSupplementalInvestors(count) {
  const firms = ["Aster","Meridian","Summit","Northstar","Crescent","Atlas","Horizon","Pinnacle","Harbour","Keystone","Arcadia","Silvercrest","Redwood","Stonebridge","Bluewater","Ironwood","Evergreen","Sovereign","Cobalt","Vanguardia","Helios","Aurora","Lighthouse","Canyon","Broadleaf","Seabrook","Oakmont","Sapphire","Granite","Longview","Copperfield","Strata","Juniper","Marathon","Cedar","Ridgeway","Blackstone Ridge","Pacific Crest","Nordic Star","Alpine Gate"];
  const regions = ["Global","North America","Europe","Nordics","Asia","Middle East","Latin America","Africa","Japan","India","China","Singapore","Australia","Canada","Germany","France","UK","Switzerland","Benelux","Iberia"];
  const types = ["Kapitalforvalter","Family Office","Hedgefond","Private Equity","Pensionsfond","Statsfond","Venture Capital","Long/Short Equity","Makro Investor","Credit Fund"];
  const aums = ["~$750M","~$1B","~$1.5B","~$2B","~$3B","~$5B","~$8B","~$12B","~$20B","~$35B","~$60B","~$100B","~$250B"];
  const colors = ["#6366f1","#0ea5e9","#22c55e","#f59e0b","#ef4444","#14b8a6","#a855f7","#0284c7"];
  const out = [];
  for (let i = 0; i < count; i++) {
    const firm = firms[i % firms.length];
    const region = regions[Math.floor(i / firms.length) % regions.length];
    const type = types[i % types.length];
    out.push({
      id: `supplemental_${String(i + 1).padStart(3, "0")}`,
      name: `${firm} ${region} ${type}`,
      avatar: "◆",
      type,
      aum: aums[i % aums.length],
      color: colors[i % colors.length],
      cat: "companies",
      nation: region,
      tx: []
    });
  }
  return out;
}

function uniqueInvestors(list) {
  const seen = new Set();
  return list.filter(inv => {
    if (!inv || !inv.id || seen.has(inv.id)) return false;
    seen.add(inv.id);
    return true;
  });
}

const BASE_INVESTORS = uniqueInvestors([...FALLBACK, ...EXTRA_INVESTORS]);
const SUPPLEMENTAL_INVESTORS = buildSupplementalInvestors(Math.max(0, 500 - BASE_INVESTORS.length));

function investorUniverse() {
  return uniqueInvestors([...BASE_INVESTORS, ...SUPPLEMENTAL_INVESTORS]);
}

investorUniverse().forEach(inv => { INV_MAP[inv.id] = inv; });

loadSettings();
initDB().then(() => seedDB()).catch(e => console.warn("DB init:", e));
